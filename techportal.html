<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechroLim Master Control Deck | Supergrid Portal</title>
  <style>
    :root {
      --bg-dark: #0a0c10;
      --panel-bg: #121620;
      --border-glow: #00ffcc55;
      --accent-cyan: #00ffcc;
      --accent-purple: #bd00ff;
      --text-main: #e0e6ed;
      --text-dim: #8b9bb4;
      --danger: #ff3366;
      --success: #00ff66;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    
    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-glow);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .brand h1 {
      font-size: 1.2rem;
      color: var(--accent-cyan);
      letter-spacing: 1px;
    }
    
    .brand span {
      font-size: 0.75rem;
      color: var(--text-dim);
    }
    
    .status-pill {
      background: rgba(0, 255, 102, 0.1);
      border: 1px solid var(--success);
      color: var(--success);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    
    main {
      flex: 1;
      padding: 15px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    
    @media (min-width: 768px) {
      main {
        grid-template-columns: 1fr 1fr;
      }
    }
    
    .card {
      background: var(--panel-bg);
      border: 1px solid var(--border-glow);
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .card h2 {
      font-size: 0.95rem;
      color: var(--accent-purple);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .port-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
      gap: 8px;
    }
    
    .port-badge {
      background: rgba(0, 255, 204, 0.05);
      border: 1px solid var(--accent-cyan);
      padding: 6px;
      text-align: center;
      border-radius: 4px;
      font-size: 0.7rem;
      color: var(--accent-cyan);
      font-weight: bold;
    }
    
    .terminal-box {
      background: #000;
      border: 1px solid var(--text-dim);
      border-radius: 4px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.75rem;
      color: var(--success);
      height: 120px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    
    textarea {
      background: #05070a;
      border: 1px solid var(--text-dim);
      color: var(--text-main);
      padding: 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.8rem;
      resize: vertical;
      height: 80px;
    }
